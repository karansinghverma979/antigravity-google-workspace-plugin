<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="card-grad-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="google-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="google-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <linearGradient id="google-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F29900"/>
    </linearGradient>
    <linearGradient id="google-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>
    <filter id="shadow-g" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" fill="url(#bg-grad-g)" rx="16"/>

  <!-- Title & Header -->
  <text x="50" y="48" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">🌐 GOOGLE WORKSPACE PLUGIN ARCHITECTURE</text>
  <text x="50" y="73" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Unified 7-in-1 Engine · Dispatch Firewall · Dynamic OAuth Token Quarantine</text>

  <!-- Tier 1: Host Clients -->
  <g filter="url(#shadow-g)">
    <rect x="50" y="100" width="900" height="65" rx="10" fill="url(#card-grad-g)" stroke="#374151" stroke-width="1.5"/>
    <text x="75" y="130" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">AI CLIENT &amp; HOST AGENT</text>
    <text x="75" y="150" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Google Antigravity CLI · Claude Desktop · Cursor · Zed · Native MCP Hosts</text>
    <rect x="760" y="113" width="160" height="38" rx="6" fill="#1F2937" stroke="#4B5563" stroke-width="1"/>
    <text x="785" y="137" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="600">JSON-RPC / stdio</text>
  </g>

  <!-- Connector Line -->
  <line x1="500" y1="165" x2="500" y2="195" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="495,190 500,200 505,190" fill="#60A5FA"/>

  <!-- Tier 2: The Dispatch Firewall -->
  <g filter="url(#shadow-g)">
    <rect x="50" y="200" width="900" height="85" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="75" y="228" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🛡️ THE DISPATCH FIREWALL &amp; SAFETY SENTINEL</text>
    <rect x="75" y="240" width="380" height="32" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="90" y="261" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✔ TIER 1: SAFE AUTONOMOUS (Read &amp; Draft-First)</text>
    <rect x="475" y="240" width="445" height="32" rx="6" fill="#7F1D1D" stroke="#DC2626" stroke-width="1"/>
    <text x="490" y="261" fill="#FECACA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚠️ TIER 2: MANDATORY CONFIRMATION (Send/Trash/Delete)</text>
  </g>

  <!-- Connector Line -->
  <line x1="500" y1="285" x2="500" y2="315" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="495,310 500,320 505,310" fill="#6366F1"/>

  <!-- Tier 3: 7-Service Engine -->
  <g filter="url(#shadow-g)">
    <rect x="50" y="320" width="900" height="155" rx="10" fill="url(#card-grad-g)" stroke="#374151" stroke-width="1.5"/>
    <rect x="50" y="320" width="900" height="32" rx="10" fill="#1F2937"/>
    <text x="75" y="342" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">7 UNIFIED SERVICE CONNECTORS (server.py · 22 Operations)</text>
    
    <!-- 7 Service Pills -->
    <!-- Gmail -->
    <rect x="75" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="75" y="365" width="115" height="5" fill="url(#google-red)" rx="2"/>
    <text x="85" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📬 Gmail</text>
    <text x="85" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Draft First</text>
    <text x="85" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Smart Queries</text>
    <text x="85" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Token Bounded</text>

    <!-- Calendar -->
    <rect x="200" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="200" y="365" width="115" height="5" fill="url(#google-blue)" rx="2"/>
    <text x="210" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📅 Calendar</text>
    <text x="210" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· ISO Scoped</text>
    <text x="210" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Event CRUD</text>
    <text x="210" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Briefing Radar</text>

    <!-- Tasks -->
    <rect x="325" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="325" y="365" width="115" height="5" fill="url(#google-blue)" rx="2"/>
    <text x="335" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✅ Tasks</text>
    <text x="335" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Open Only</text>
    <text x="335" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Fast Checkoff</text>
    <text x="335" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Due Filtering</text>

    <!-- Drive -->
    <rect x="450" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="450" y="365" width="115" height="5" fill="url(#google-yellow)" rx="2"/>
    <text x="460" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📂 Drive</text>
    <text x="460" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Name Search</text>
    <text x="460" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Trash Safety</text>
    <text x="460" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Text Export</text>

    <!-- Docs -->
    <rect x="575" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="575" y="365" width="115" height="5" fill="url(#google-blue)" rx="2"/>
    <text x="585" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📝 Docs</text>
    <text x="585" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Create Blank</text>
    <text x="585" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Append Notes</text>
    <text x="585" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Structure Read</text>

    <!-- Sheets -->
    <rect x="700" y="365" width="115" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="700" y="365" width="115" height="5" fill="url(#google-green)" rx="2"/>
    <text x="710" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Sheets</text>
    <text x="710" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· A1 Bounded</text>
    <text x="710" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Append Rows</text>
    <text x="710" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Range Updates</text>

    <!-- Contacts -->
    <rect x="825" y="365" width="105" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <rect x="825" y="365" width="105" height="5" fill="url(#google-yellow)" rx="2"/>
    <text x="833" y="387" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👥 Contacts</text>
    <text x="833" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Query Search</text>
    <text x="833" y="420" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Add Contact</text>
    <text x="833" y="435" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">· Email/Phone</text>
  </g>

  <!-- Connector Line -->
  <line x1="500" y1="475" x2="500" y2="505" stroke="#34A853" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="495,500 500,510 505,500" fill="#34A853"/>

  <!-- Tier 4: Google Cloud Platform -->
  <g filter="url(#shadow-g)">
    <rect x="50" y="510" width="900" height="85" rx="10" fill="url(#card-grad-g)" stroke="#374151" stroke-width="1.5"/>
    <text x="75" y="540" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">GOOGLE CLOUD PLATFORM · WORKSPACE APIS</text>
    <text x="75" y="562" fill="#9CA3AF" font-family="monospace" font-size="12">OAuth 2.0 Credentials (credentials.json) · Cached Refresh Tokens (token.json quarantined in .gitignore)</text>
    <text x="75" y="578" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">HTTPS REST Endpoints · Automatic Refresh via google-auth · Multi-Location Dynamic Path Resolution</text>
    <rect x="760" y="525" width="160" height="38" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="785" y="549" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="600">HTTPS / REST</text>
  </g>
</svg>
